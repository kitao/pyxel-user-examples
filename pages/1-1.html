  <div id="lightbox" onclick="this.style.display='none';document.body.classList.remove('lightbox-open')">
    <div id="lightbox-frame">
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>
  <script>
    const lbImg = document.getElementById('lightbox-img');
    const lb = document.getElementById('lightbox');
    lb.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    const PAD = 32;

    document.querySelectorAll('.card img').forEach(img => {
      img.style.cursor = 'pointer';
      img.addEventListener('click', e => {
        e.preventDefault();
        // Scale image to fit viewport while keeping pixel art sharp
        const tmp = new Image();
        tmp.onload = () => {
          const maxW = window.innerWidth * 0.85 - PAD * 2;
          const maxH = window.innerHeight * 0.85 - PAD * 2;
          const scale = Math.min(maxW / tmp.naturalWidth, maxH / tmp.naturalHeight);
          lbImg.style.width = (tmp.naturalWidth * scale) + 'px';
          lbImg.style.height = (tmp.naturalHeight * scale) + 'px';
          lbImg.src = img.src;
          document.body.classList.add('lightbox-open');
          lb.style.display = 'flex';
        };
        tmp.src = img.src;
      });
    });
  </script>
