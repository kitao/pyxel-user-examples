<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="icon" href="{{root}}favicon.ico">
  <link rel="stylesheet" href="{{css_path}}">
</head>
<body>
  <header>
    <h1><a href="{{root}}index.html">Pyxel User Examples</a></h1>
    <p>
      Works made with <a href="https://github.com/kitao/pyxel" target="_blank" rel="noopener">Pyxel</a>.
      Please share yours <a href="https://github.com/kitao/pyxel/discussions/new?category=user-examples" target="_blank" rel="noopener">here</a>!
    </p>
  </header>
  <nav>
    {{nav}}
  </nav>
  <main>
    {{entries}}
  </main>
  <nav class="bottom-nav">
    {{nav}}
  </nav>
  <div id="lightbox">
    <div id="lightbox-frame">
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>
  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-img');
    const LIGHTBOX_PADDING = 32;

    function closeLightbox() {
      lightbox.style.display = 'none';
      document.body.classList.remove('lightbox-open');
    }

    lightbox.addEventListener('click', closeLightbox);
    lightbox.addEventListener(
      'touchmove',
      event => event.preventDefault(),
      { passive: false }
    );

    document.querySelectorAll('.card img').forEach(image => {
      image.style.cursor = 'pointer';
      image.addEventListener('click', event => {
        event.preventDefault();
        // Scale image to fit the viewport while keeping pixel art sharp.
        const previewImage = new Image();
        previewImage.onload = () => {
          const maxWidth = window.innerWidth * 0.85 - LIGHTBOX_PADDING * 2;
          const maxHeight = window.innerHeight * 0.85 - LIGHTBOX_PADDING * 2;
          const scale = Math.min(
            maxWidth / previewImage.naturalWidth,
            maxHeight / previewImage.naturalHeight
          );
          lightboxImage.style.width = (previewImage.naturalWidth * scale) + 'px';
          lightboxImage.style.height = (previewImage.naturalHeight * scale) + 'px';
          lightboxImage.src = image.src;
          document.body.classList.add('lightbox-open');
          lightbox.style.display = 'flex';
        };
        previewImage.src = image.src;
      });
    });
  </script>
</body>
</html>
